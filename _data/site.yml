# - Site information - #

# - SEO & social sharing
seo:
  url: "https://example.com"
  title: "Your Name - Title / Role"
  description: "Short description of who you are and what you do."
  language: "en"
  locale: "en_GB"
  image: "/assets/images/og-image.png"  # Preview image when shared on social media (1200x630 recommended)
  image_alt: "Your Name - Title / Role"
  theme_color: "#111111"                # Browser toolbar colour on mobile
  favicon: ""                           # e.g. "/assets/images/favicon.png" (optional)
  noindex: false

# - Identity
name: "Your Name"
role: "Title / Role"
location: "City, Country"

# - Hero
hero:
  greeting: "Hi, I'm"
  headshot: "/assets/images/headshot.svg"
  headshot_alt: "Portrait of Your Name"
  description: "One or two sentences introducing yourself."
  resume_file: ""
  resume_text: "Download my resume"

# - Projects section heading
projects_heading: "Selected Work"

# - About
about:
  heading: "About Me"
  text: |
    A short paragraph about yourself, your approach, and your values.

    You can write a second paragraph by leaving a blank line, and use
    **bold**, *italics* and [links](https://example.com).
# Icons: https://fontawesome.com/v4/icons/
  skills:
    - icon: "code"
      label: "Skill one"
    - icon: "pencil"
      label: "Skill two"
    - icon: "cube"
      label: "Skill three"

# - Contact
contact:
  heading: "Get in touch"
  email: "you@example.com"
  links:
    - icon: "linkedin"
      label: "linkedin.com/in/username"
      url: "https://linkedin.com/in/username"
    - icon: "github"
      label: "github.com/username"
      url: "https://github.com/username"

# - Footer
footer_text: "© Your Name"
